name: Update GitHub Profile Statistics

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-profile-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate GitHub Statistics
        continue-on-error: true
        run: |
          curl -fLsS --retry 3 --max-time 60 \
            "https://github-readme-stats.vercel.app/api?username=ghabghoub1&show_icons=true&theme=tokyonight&hide_border=true&rank_icon=github&include_all_commits=true" \
            -o profile/stats.tmp.svg

      - name: Generate Most Used Languages
        continue-on-error: true
        run: |
          curl -fLsS --retry 3 --max-time 60 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=ghabghoub1&layout=compact&theme=tokyonight&hide_border=true&langs_count=8" \
            -o profile/top-langs.tmp.svg

      - name: Generate Contribution Activity Graph
        continue-on-error: true
        run: |
          curl -fLsS --retry 3 --max-time 60 \
            "https://github-readme-activity-graph.vercel.app/graph?username=ghabghoub1&theme=react-dark&hide_border=true&area=true" \
            -o profile/activity-graph.tmp.svg

      - name: Validate and update SVG files
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          profile = Path("profile")

          files = [
              "stats.svg",
              "top-langs.svg",
              "activity-graph.svg",
          ]

          for filename in files:
              target = profile / filename
              temporary = profile / filename.replace(".svg", ".tmp.svg")

              if not temporary.exists():
                  print(f"WARNING: Download failed for {filename}")
                  continue

              try:
                  root = ET.parse(temporary).getroot()

                  if root.tag != "{http://www.w3.org/2000/svg}svg":
                      raise ValueError("Invalid SVG root element")

                  if temporary.stat().st_size < 500:
                      raise ValueError("SVG file is unexpectedly small")

                  temporary.replace(target)

                  print(f"SUCCESS: Updated {filename}")

              except Exception as error:
                  print(f"ERROR: {filename}: {error}")
                  temporary.unlink(missing_ok=True)

          PY

      - name: Commit updated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg
          git reset -q -- 'profile/*.tmp.svg' 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No statistics updates available"
          else
            git commit -m "chore: update GitHub profile statistics"
            git push
          fi
